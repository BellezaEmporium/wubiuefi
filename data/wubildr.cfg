set show_panic_message=true

if search --no-floppy --file --set=hostdrive /ubuntu/disks/root.disk; then
    if loopback loopw0 ($hostdrive)/ubuntu/disks/root.disk; then
        set root=(loopw0)
        if [ -e /boot/grub/grub.cfg ]; then
            set prefix=(loopw0)/boot/grub
            if configfile (loopw0)/boot/grub/grub.cfg; then
                set show_panic_message=false
            fi
        elif [ -e /grub/grub.cfg ]; then
            if configfile (loopw0)/grub/grub.cfg; then
                set show_panic_message=false
            fi
        fi
    fi
fi

if [ ${show_panic_message} = true ]; then
    if search --no-floppy --file --set=hostdrive /ubuntu/install/boot/grub/grub.cfg; then
        if configfile ($hostdrive)/ubuntu/install/boot/grub/grub.cfg; then
            set show_panic_message=false
        fi
    fi
fi

if [ ${show_panic_message} = true ]; then
    if search --no-floppy --file --set=hostdrive /ubuntu/install/wubildr-disk.cfg; then
        if configfile ($hostdrive)/ubuntu/install/wubildr-disk.cfg; then
            set show_panic_message=false
        fi
    fi
fi

if [ ${show_panic_message} = true ]; then
    if search --no-floppy --file --set=hostdrive /grub.cfg; then
        if configfile ($hostdrive)/grub.cfg; then
            set show_panic_message=false
        fi
    fi
fi

if [ ${show_panic_message} = true ]; then
    echo "It is not possible to boot from the Ubuntu image."
    echo "Please verify that the Ubuntu installation was not removed."
    echo "If that is not the case, please check that the Windows filesystem"
    echo "is not corrupted: reboot into Windows and run: chkdsk /r"
    echo "Then try again."
fi