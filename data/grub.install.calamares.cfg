# This file is modified at runtime by bootmenu.nsh.
# This file is for wubiuefi to understand which installer it triggers.
# Since 24.04, all the other distributions are using calamares,
# and Ubuntu is the only one using subiquity (not ubiquity anymore).

set default=0
echo "$(title1)"
echo "$(title2)"
if sleep --verbose --interruptible 5 ; then
   set timeout=0
fi
echo

search -s -f -n $(kernel)

menuentry "$(normal_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) quiet splash lang=$(locale) keytable=$(keyboard_layout) tz=$(timezone) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(safe_graphic_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) quiet splash xforcevesa lang=$(locale) keytable=$(keyboard_layout) tz=$(timezone) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(verbose_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) debug lang=$(locale) keytable=$(keyboard_layout) tz=$(timezone) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(demo_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) quiet splash lang=$(locale) keytable=$(keyboard_layout) tz=$(timezone) -- $(rootflags)
    initrd $(initrd)
}
