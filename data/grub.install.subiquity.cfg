# This file is modified at runtime by bootmenu.nsh.
# This file is for wubiuefi to understand which installer it triggers.
# Since Ubuntu 24.04, Ubuntu is the only one using subiquity (not ubiquity anymore),
# and the other flavors are using calamares.

set default=0
echo "$(title1)"
echo "$(title2)"
if sleep --verbose --interruptible 5 ; then
   set timeout=0
fi
echo

search -s -f -n $(kernel)

menuentry "$(normal_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) autoinstall ds=nocloud\;s=file:///host$(custom_installation_dir)/autoinstall/ quiet splash locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(safe_graphic_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) autoinstall ds=nocloud\;s=file:///host$(custom_installation_dir)/autoinstall/ quiet splash xforcevesa locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(verbose_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) autoinstall ds=nocloud\;s=file:///host$(custom_installation_dir)/autoinstall/ debug locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(rootflags)
    initrd $(initrd)
}

menuentry "$(demo_mode_title)" {
    linux $(kernel) boot=casper iso-scan/filename=$(iso_path) quiet splash locale=$(locale) keyboard-configuration/layoutcode=$(keyboard_layout) keyboard-configuration/variantcode=$(keyboard_variant) -- $(rootflags)
    initrd $(initrd)
}
